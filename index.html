    <body class="bg-background text-on-background font-body-md overflow-y-auto min-h-screen flex flex-col">
<!-- Top App Bar -->
<header class="bg-surface border-b border-outline-variant flex justify-between items-center w-full px-margin-desktop h-20 shrink-0">

</div>
<div class="flex items-center gap-4">
<div class="flex flex-col items-end">
<span class="font-label-lg text-label-lg text-primary">6767</span>
<span class="font-label-md text-label-md text-on-surface-variant">ID: #6767</span>
</div>
<span class="material-symbols-outlined text-primary text-headline-md">admin_panel_settings</span>

</header>
<!-- Main Content Canvas -->
<main class="flex-grow w-full px-margin-desktop py-gutter flex items-start justify-center relative">
<!-- Background Decoration/Pattern (Subtle) -->
<div class="absolute inset-0 opacity-10 pointer-events-none select-none overflow-hidden">
<div class="grid grid-cols-12 h-full w-full gap-gutter">
<div class="border-l border-outline h-full"></div>

<div class="border-l border-outline h-full"></div>
<div class="border-l border-outline h-full"></div>
<div class="border-l border-outline h-full"></div>
<div class="border-l border-outline h-full"></div>
<div class="border-l border-outline h-full"></div>
<div class="border-l border-outline h-full"></div>
<div class="border-l border-outline h-full"></div>
<div class="border-l border-outline h-full"></div>
<div class="border-l border-outline h-full"></div>
<div class="border-l border-outline h-full"></div>
</div>
</div>
<div class="grid grid-cols-12 gap-gutter w-full max-w-[1200px] z-10">
<!-- Left Side: Instructions & Scan -->
<div class="col-span-5 flex flex-col justify-center space-y-8">
<div class="space-y-4">
<h2 class="font-headline-lg text-headline-lg text-on-surface leading-tight">Teacher System</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">please enter your PIN to access your account</p>


</div>
</div>
<!-- Right Side: Numerical Keypad -->
<div class="col-span-7 flex justify-center">
<div class="bg-white rounded-xl login-card border border-outline-variant p-10 w-full max-w-[500px]">
<!-- PIN Input Display -->
<div class="mb-8">
<label class="font-label-lg text-label-lg text-on-surface-variant block mb-4">Enter PIN Code</label>
<div class="flex gap-4 justify-between" id="pin-display">
<!-- PIN dots -->
<div class="w-14 h-16 rounded-lg border-2 border-outline-variant flex items-center justify-center bg-surface-container-low transition-all" data-index="0"></div>
<div class="w-14 h-16 rounded-lg border-2 border-outline-variant flex items-center justify-center bg-surface-container-low transition-all" data-index="1"></div>
<div class="w-14 h-16 rounded-lg border-2 border-outline-variant flex items-center justify-center bg-surface-container-low transition-all" data-index="2"></div>
<div class="w-14 h-16 rounded-lg border-2 border-outline-variant flex items-center justify-center bg-surface-container-low transition-all" data-index="3"></div>
<div class="w-14 h-16 rounded-lg border-2 border-outline-variant flex items-center justify-center bg-surface-container-low transition-all" data-index="4"></div>
<div class="w-14 h-16 rounded-lg border-2 border-outline-variant flex items-center justify-center bg-surface-container-low transition-all" data-index="5"></div>
</div>
</div>
<!-- Keypad Grid -->
<div class="grid grid-cols-3 gap-4">
<!-- Numbers 1-9 -->

<button class="keypad-button h-24 rounded-xl bg-surface-container-high border border-outline-variant text-on-surface font-headline-md flex items-center justify-center transition-transform duration-100" onclick="appendDigit('2')">2</button>
<button class="keypad-button h-24 rounded-xl bg-surface-container-high border border-outline-variant text-on-surface font-headline-md flex items-center justify-center transition-transform duration-100" onclick="appendDigit('3')">3</button>
<button class="keypad-button h-24 rounded-xl bg-surface-container-high border border-outline-variant text-on-surface font-headline-md flex items-center justify-center transition-transform duration-100" onclick="appendDigit('4')">4</button>
<button class="keypad-button h-24 rounded-xl bg-surface-container-high border border-outline-variant text-on-surface font-headline-md flex items-center justify-center transition-transform duration-100" onclick="appendDigit('5')">5</button>
<button class="keypad-button h-24 rounded-xl bg-surface-container-high border border-outline-variant text-on-surface font-headline-md flex items-center justify-center transition-transform duration-100" onclick="appendDigit('6')">6</button>
<button class="keypad-button h-24 rounded-xl bg-surface-container-high border border-outline-variant text-on-surface font-headline-md flex items-center justify-center transition-transform duration-100" onclick="appendDigit('7')">7</button>
<button class="keypad-button h-24 rounded-xl bg-surface-container-high border border-outline-variant text-on-surface font-headline-md flex items-center justify-center transition-transform duration-100" onclick="appendDigit('8')">8</button>
<button class="keypad-button h-24 rounded-xl bg-surface-container-high border border-outline-variant text-on-surface font-headline-md flex items-center justify-center transition-transform duration-100" onclick="appendDigit('9')">9</button>

<span class="material-symbols-outlined !text-3xl">close</span>
</button>
<button class="keypad-button h-24 rounded-xl bg-surface-container-high border border-outline-variant text-on-surface font-headline-md flex items-center justify-center transition-transform duration-100" onclick="appendDigit('0')">0</button>

<span class="material-symbols-outlined !text-3xl">backspace</span>
</button>

<button class="mt-8 w-full h-16 bg-primary text-on-primary rounded-xl font-label-lg flex items-center justify-center gap-3 active:scale-95 transition-all opacity-50 cursor-not-allowed" id="login-submit">
<span class="material-symbols-outlined">login</span>

                    </button>

<!-- Footer Status -->
<footer class="h-12 bg-surface-container px-margin-desktop flex items-center justify-between border-t border-outline-variant shrink-0">
<div class="flex items-center gap-4 text-on-surface-variant">
<div class="flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-green-500"></span>
<span class="font-label-md text-label-md">System Online</span>
</div>
<div class="h-4 w-[1px] bg-outline-variant"></div>
<span class="font-label-md text-label-md">Beta_1</span>
</div>
<div class="flex items-center gap-2 text-on-surface-variant">
<span class="material-symbols-outlined !text-sm">schedule</span>
<span class="font-label-md text-label-md" id="current-time">Monday, Oct 23 • 08:45 AM</span>
</div>
</footer>
<script>
        const pinDisplay = document.getElementById('pin-display');
        const loginBtn = document.getElementById('login-submit');
        let currentPin = '';
        const maxPinLength = 6;

        function updatePinUI() {
            const boxes = pinDisplay.querySelectorAll('div');
            boxes.forEach((box, index) => {
                if (index < currentPin.length) {
                    box.innerHTML = '<span class="w-4 h-4 bg-primary rounded-full"></span>';
                    box.classList.add('border-primary');
                    box.classList.remove('border-outline-variant', 'bg-surface-container-low');
                    box.classList.add('bg-primary-fixed');
                } else {
                    box.innerHTML = '';
                    box.classList.remove('border-primary', 'bg-primary-fixed');
                    box.classList.add('border-outline-variant', 'bg-surface-container-low');
                }
            });

            if (currentPin.length === maxPinLength) {
                loginBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                loginBtn.classList.add('hover:bg-primary-container');
            } else {
                loginBtn.classList.add('opacity-50', 'cursor-not-allowed');
                loginBtn.classList.remove('hover:bg-primary-container');
            }
        }

        function appendDigit(digit) {
            if (currentPin.length < maxPinLength) {
                currentPin += digit;
                updatePinUI();
            }
        }

        function backspace() {
            if (currentPin.length > 0) {
                currentPin = currentPin.slice(0, -1);
                updatePinUI();
            }
        }

        function clearPin() {
            currentPin = "";
            updatePinUI();
        }

        function updateClock() {
            const now = new Date();
            const options = { weekday: 'long', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
            document.getElementById('current-time').innerText = now.toLocaleDateString('en-US', options).replace(',', ' •');
        }
        setInterval(updateClock, 1000);
        updateClock();

        const correctPin = '111111';

        loginBtn.addEventListener('click', () => {
            if (currentPin.length === maxPinLength) {
                loginBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> VERIFYING...';
                setTimeout(() => {
                    if (currentPin === correctPin) {
                        loginBtn.innerHTML = '<span class="material-symbols-outlined text-green-500">check_circle</span> Cool!!';
                        loginBtn.classList.add('bg-green-600');
                        setTimeout(() => window.location.href = 'grade-selection.html', 600);
                    } else {
                        loginBtn.innerHTML = '<span class="material-symbols-outlined text-red-600">error</span> Wrong PIN. Try Again or go sleep.';
                        loginBtn.classList.add('bg-red-600');
                        setTimeout(() => {
                            loginBtn.classList.remove('bg-red-600');
                            loginBtn.innerHTML = '<span class="material-symbols-outlined">login</span> AUTHORIZE ACCESS';
                            clearPin();
                        }, 1200);
                    }
                }, 1500);
            }
        });

        window.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') appendDigit(e.key);
            if (e.key === 'Backspace') backspace();
            if (e.key === 'Escape') clearPin();
        });
</script>
