<script>
    document.querySelectorAll('.kiosk-btn-active').forEach(button => {
        button.addEventListener('mousedown', () => {
            button.classList.add('scale-95');
        });
        button.addEventListener('mouseup', () => {
            button.classList.remove('scale-95');
        });
        button.addEventListener('mouseleave', () => {
            button.classList.remove('scale-95');
        });
    });

    function updateHeaderDateTime() {
        const now = new Date();
        const options = { weekday: 'long', day: 'numeric', month: 'long' };
        const formattedDate = now.toLocaleDateString('th-TH', options);
        const formattedTime = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
        document.getElementById('header-date').textContent = formattedDate;
        document.getElementById('header-time').textContent = formattedTime;
    }

    updateHeaderDateTime();
    setInterval(updateHeaderDateTime, 1000);
</script>
