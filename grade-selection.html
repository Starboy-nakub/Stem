<style>
        body {
            background-color: #f8f9fa;
            color: #191c1d;
            overflow-y: auto;
            min-height: 100vh;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
            user-select: none;
        }
        .grade-button-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .grade-button-card:active {
            transform: scale(0.96);
        }
        .disabled-grade-card {
            opacity: 0.45;
            pointer-events: none;
            cursor: not-allowed;
        }
        .grade-card-locked-icon {
            position: absolute;
            top: 1rem;
            right: 1rem;
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 9999px;
            background-color: rgba(15, 23, 42, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .grade-card-locked-icon span {
            font-size: 1.15rem;
            color: #475569;
        }
        .pulse-red {
            animation: pulse-red-animation 2.5s infinite;
        }
        @keyframes pulse-red-animation {
            0% { box-shadow: 0 0 0 0 rgba(186, 26, 26, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(186, 26, 26, 0); }
            100% { box-shadow: 0 0 0 0 rgba(186, 26, 26, 0); }
        }
        .bento-grid-landscape {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 32px;
            width: 100%;
            height: 100%;
        }
    </style>

<body class="flex flex-col min-h-screen font-body-md text-body-md overflow-y-auto">
<header class="bg-white border-b border-outline-variant flex justify-between items-center w-full px-margin-desktop h-24 fixed top-0 z-50">
<div class="flex items-center gap-6">

</button>
<div class="h-10 w-px bg-outline-variant"></div>
<h1 class="font-headline-md text-headline-md font-bold text-primary tracking-tight">STARBOY</h1>
</div>
<div class="flex items-center gap-8">
<div class="text-right">
<div class="font-label-lg font-bold text-on-surface" id="clock">xx:xx</div>
<div class="font-label-md text-on-surface-variant" id="date">Lor all time, xx/xx/xxxx</div>
</div>
<button class="bg-surface-container-high p-4 rounded-full relative">
<span class="material-symbols-outlined text-on-surface-variant">notifications</span>
<span class="absolute top-3 right-3 w-3 h-3 bg-error rounded-full border-2 border-white"></span>
</button>
</div>
</header>
<main class="flex-1 mt-24 mb-48 flex flex-col items-center justify-center px-margin-desktop relative">
<div class="absolute top-1/4 -right-64 w-[600px] h-[600px] bg-primary-container opacity-5 rounded-full blur-[120px]"></div>
<div class="absolute bottom-1/4 -left-64 w-[600px] h-[600px] bg-secondary-container opacity-10 rounded-full blur-[120px]"></div>
<div class="w-full max-w-7xl z-10 flex flex-col h-full py-8">
<div class="mb-10 text-center">
<h2 class="font-display-lg text-display-lg text-on-surface mb-2">กรุณาเลือกชั้นเรียน</h2>
<p class="text-on-surface-variant font-body-lg text-body-lg">Please select  grade level </p>
</div>
<div class="bento-grid-landscape flex-1">
<div class="grade-button-card disabled-grade-card relative bg-white border-2 border-outline-variant rounded-2xl p-10 flex flex-col items-center justify-center shadow-sm transition-all duration-300">
<div class="grade-card-locked-icon"><span class="material-symbols-outlined">lock</span></div>

</div>
<span class="font-headline-lg text-headline-lg font-bold text-on-surface">มัธยมศึกษาปีที่ 1</span>
<span class="font-label-lg text-label-lg text-on-surface-variant mt-2">Grade 7</span>
</div>

<div class="w-28 h-28 bg-tertiary-fixed-dim flex items-center justify-center rounded-full mb-8 transition-all duration-300 transform">

</div>

</main>
<script>
    function updateDateTime() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('clock').textContent = `${hours}:${minutes}`;
        const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
        document.getElementById('date').textContent = now.toLocaleDateString('en-US', options);
    }
    setInterval(updateDateTime, 1000);
    updateDateTime();
    document.querySelectorAll('.grade-button-card').forEach(card => {
        card.addEventListener('mousedown', () => {
            card.classList.add('bg-primary-container/20');
        });
        card.addEventListener('mouseup', () => {
            card.classList.remove('bg-primary-container/20');
        });
        card.addEventListener('mouseleave', () => {
            card.classList.remove('bg-primary-container/20');
        });
    });
</script>
</body></html>
