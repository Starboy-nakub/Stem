<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8"/>

<style>
    .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        user-select: none;
    }
    .kiosk-btn-active:active {
        transform: scale(0.96);
        transition: transform 0.1s ease-in-out;
    }
    body {
        min-height: 100vh;
    }
</style>
</head>
<body class="bg-surface text-on-surface font-body-md overflow-auto min-h-screen flex flex-col">
<header class="flex justify-between items-center w-full px-6 md:px-16 h-20 bg-white border-b border-outline-variant z-50 shrink-0">
    <div class="flex items-center gap-4">
        <button class="flex items-center justify-center w-12 h-12 rounded-full hover:bg-surface-container-high transition-colors kiosk-btn-active" onclick="window.history.back()">
            <span class="material-symbols-outlined text-primary">menu</span>
        </button>
        <h1 class="font-headline-md text-headline-md font-bold text-primary">STARBOY</h1>
    </div>
    <div class="flex items-center gap-4">
        <button class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors">
            <span class="material-symbols-outlined text-on-surface-variant">notifications</span>
        </button>
    </div>
</header>
<main class="flex-1 overflow-auto relative flex flex-col mt-24 mb-48">
    <div class="flex-1 overflow-y-auto relative z-10">
        <div class="max-w-7xl mx-auto px-6 md:px-16 py-8 h-full flex flex-col">
            <div class="flex flex-col md:flex-row md:items-end justify-between gap-6 mb-10">
                <div class="flex flex-col gap-4">
                    <nav>
                        <button class="flex items-center gap-2 text-primary font-label-lg text-label-lg px-6 py-3 rounded-xl bg-primary-fixed hover:bg-primary hover:text-white transition-all kiosk-btn-active shadow-sm" onclick="window.history.back()">
                            <span class="material-symbols-outlined">arrow_back</span>
                            <span>กลับไปเลือกห้อง</span>
                        </button>
                    </nav>
                    <div>
                        <h2 class="font-headline-lg text-headline-lg text-on-surface mb-2">ห้องเรียน ม.3/5</h2>
                        <div class="h-1.5 w-32 bg-primary rounded-full"></div>
                    </div>
                </div>
            </div>
            <div class="grid gap-6">
                <section class="rounded-3xl bg-white border border-outline-variant shadow-md p-8">
                    <h3 class="font-headline-lg text-headline-lg font-bold text-on-surface mb-4">รายละเอียดห้อง</h3>
                    <div class="grid gap-4 sm:grid-cols-2">
                        <div class="rounded-3xl bg-surface-container-lowest p-6">
                            <span class="font-label-lg text-label-lg text-on-surface-variant">ครูประจำชั้น</span>
                            <p class="font-body-lg mt-3">คุณครู อัญทิรา วาดี</p>
                        </div>
                        <div class="rounded-3xl bg-surface-container-lowest p-6">
                            <span class="font-label-lg text-label-lg text-on-surface-variant">จำนวนนักเรียน</span>
                            <p class="font-body-lg mt-3">36 คน</p>
                        </div>
                    </div>
                </section>
                <section class="rounded-3xl bg-white border border-outline-variant shadow-md p-8">
                    <h3 class="font-headline-lg text-headline-lg font-bold text-on-surface mb-4">กิจกรรมล่าสุด</h3>
                    <p class="text-on-surface-variant font-body-lg">6767676767676767 อย่าสงสัย วอเตอ/7 หวานเจี้ยบ</p>
                </section>
            </div>
        </div>
    </div>
</main>
<script>
    document.querySelectorAll('.kiosk-btn-active').forEach(button => {
        button.addEventListener('mousedown', () => {
            button.classList.add('scale-95');
        });
        button.addEventListener('mouseup', () => {
            button.classList.remove('scale-95');
        });
        button.addEventListener('mouseleave', () => {
            button.classList.remove('scale-95');
        });
    });
</script>
</body>
</html>
